name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release executable
        run: cargo build --release --locked

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/release/kplay.exe dist/KPlay.exe
          Compress-Archive -Path dist/KPlay.exe -DestinationPath KPlay-windows-x86_64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPlay-windows-x86_64
          path: KPlay-windows-x86_64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: KPlay-windows-x86_64.zip
