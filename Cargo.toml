[package]
name = "kplay"
version = "0.1.1"
edition = "2024"

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
cbc = "0.1"
clap = { version = "4.6.9", features = ["derive"] }
cpal = "0.15"
ctr = "0.9"
dirs = "7.0.0"
ed25519-dalek = "2"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
env_logger = "0.11.12"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.35"
mdns-sd = "0.22.0"
plist = "1.10.4"
rand = "0.8"
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
softbuffer = "0.4.8"
winit = "0.30.13"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[build-dependencies]
cc = "1.11.3"

[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

